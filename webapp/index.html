<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Office</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --card2: #1c2333;
            --border: rgba(255,255,255,0.08);
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --text: #e6edf3;
            --muted: #8b949e;
            --radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 32px; }

        #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 14px; }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        #user-view, #admin-view { display: none; animation: fadeUp 0.4s ease; }

        .profile-hero { background: linear-gradient(160deg, #1a2744 0%, #0d1117 60%); padding: 32px 20px 24px; text-align: center; border-bottom: 1px solid var(--border); }
        .avatar { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 14px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #fff; box-shadow: 0 0 0 4px rgba(59,130,246,0.15); }
        .profile-hero h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .profile-hero p { font-size: 12px; color: var(--muted); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
        .stat-card .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
        .stat-card .value { font-size: 22px; font-weight: 700; }
        .stat-card .value.blue { color: var(--primary); }
        .stat-card .value.green { color: var(--success); }

        .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 16px; margin: 4px 0 10px; }

        .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px; }
        .feat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; }
        .feat-card .icon { font-size: 20px; }

        .btn-primary { display: block; width: calc(100% - 32px); margin: 20px 16px 0; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }

        .admin-header { background: linear-gradient(160deg, #0d2137 0%, #0d1117 60%); padding: 28px 20px 20px; border-bottom: 1px solid var(--border); }
        .admin-header .title { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
        .admin-header .count { font-size: 38px; font-weight: 800; letter-spacing: -1px; }
        .admin-header .today-badge { display: inline-block; background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.25); border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 600; margin-top: 6px; }

        .search-wrap { padding: 12px 16px; }
        .search-wrap input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; }
        .search-wrap input::placeholder { color: var(--muted); }
        .search-wrap input:focus { border-color: var(--primary); }

        #users-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
        .u-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
        .u-idx { font-size: 12px; color: var(--muted); min-width: 20px; text-align: center; }
        .u-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
        .u-info { flex: 1; min-width: 0; }
        .u-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .u-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; align-items: center; }
        .u-meta span { font-size: 11px; color: var(--muted); }
        .usage-pill { background: rgba(59,130,246,0.12); color: var(--primary); border-radius: 6px; padding: 1px 7px; font-size: 11px; font-weight: 600; }
        .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
    </style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
    <p style="color:#8b949e;font-size:13px">Yuklanmoqda...</p>
</div>

<div id="user-view">
    <div class="profile-hero">
        <div class="avatar" id="u-avatar">??</div>
        <h2 id="u-name">Foydalanuvchi</h2>
        <p id="u-joined">Yuklanmoqda...</p>
    </div>
    <div style="padding: 16px 16px 0;"><div class="section-title">Statistikangiz</div></div>
    <div class="stats-grid">
        <div class="stat-card"><div class="label">Foydalanish</div><div class="value blue" id="s-usage">0</div></div>
        <div class="stat-card"><div class="label">Kun (botda)</div><div class="value" id="s-days">0</div></div>
        <div class="stat-card"><div class="label">Daraja</div><div class="value green" id="s-level" style="font-size:16px">🌱 Yangi</div></div>
        <div class="stat-card"><div class="label">Keyingi darajaga</div><div class="value" id="s-next" style="font-size:16px">5 ta</div></div>
    </div>
    <div style="padding: 16px 16px 0;"><div class="section-title">Bot imkoniyatlari</div></div>
    <div class="features-grid">
        <div class="feat-card"><span class="icon">📁</span> Hujjatlar</div>
        <div class="feat-card"><span class="icon">🔄</span> Konvertor</div>
        <div class="feat-card"><span class="icon">🤖</span> AI Yordam</div>
        <div class="feat-card"><span class="icon">📋</span> Obyektivka</div>
    </div>
    <button class="btn-primary" onclick="tg.close()">← Botga qaytish</button>
</div>

<div id="admin-view">
    <div class="admin-header">
        <div class="title">Jami foydalanuvchilar</div>
        <div class="count" id="total-count">—</div>
        <div class="today-badge" id="today-badge">+0 bugun</div>
    </div>
    <div class="search-wrap">
        <input type="text" id="search-input" placeholder="🔍  Ism yoki ID bo'yicha izlash..." oninput="filterUsers()">
    </div>
    <div id="users-list"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    try { tg.setHeaderColor('#0d1117'); } catch(e) {}

    let allUsers = [];
    const COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#14b8a6'];

    function initials(name) {
        if (!name) return '?';
        return name.split(' ').map(w => w[0] || '').join('').toUpperCase().slice(0, 2);
    }
    function aColor(id) { return COLORS[Math.abs(id || 0) % COLORS.length]; }

    function relDate(str) {
        if (!str) return '—';
        const diff = Math.floor((Date.now() - new Date(str)) / 60000);
        if (diff < 1) return 'Hozirgina';
        if (diff < 60) return diff + ' daq oldin';
        const h = Math.floor(diff / 60);
        if (h < 24) return h + ' soat oldin';
        const d = Math.floor(h / 24);
        if (d === 1) return 'Kecha';
        if (d < 30) return d + ' kun oldin';
        return Math.floor(d / 30) + ' oy oldin';
    }

    function fullDate(str) {
        if (!str) return "Ma'lumot yo'q";
        try {
            return new Date(str).toLocaleDateString('uz-UZ', {day:'2-digit', month:'long', year:'numeric'}) + " da qo'shilgan";
        } catch { return str; }
    }

    function getLevel(n) {
        if (n >= 100) return { label: '💎 Pro', next: '✅ Max' };
        if (n >= 50)  return { label: '🥇 Expert', next: (100-n) + ' ta' };
        if (n >= 20)  return { label: '🥈 Faol', next: (50-n) + ' ta' };
        if (n >= 5)   return { label: "🥉 O'rta", next: (20-n) + ' ta' };
        return { label: '🌱 Yangi', next: (5-n) + ' ta' };
    }

    function renderUserView(profile, tgUser) {
        const name = tgUser && tgUser.first_name ? tgUser.first_name : (profile.name || 'Foydalanuvchi');
        const usage = profile.usage_count || 0;
        const days = profile.joined_date ? Math.max(1, Math.floor((Date.now()-new Date(profile.joined_date))/86400000)) : 0;
        const lv = getLevel(usage);
        document.getElementById('u-avatar').textContent = initials(name);
        document.getElementById('u-avatar').style.background = 'linear-gradient(135deg,' + aColor(tgUser && tgUser.id) + ',#1d4ed8)';
        document.getElementById('u-name').textContent = name;
        document.getElementById('u-joined').textContent = fullDate(profile.joined_date);
        document.getElementById('s-usage').textContent = usage;
        document.getElementById('s-days').textContent = days;
        document.getElementById('s-level').textContent = lv.label;
        document.getElementById('s-next').textContent = lv.next;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('user-view').style.display = 'block';
    }

    function renderAdminView(data) {
        allUsers = data.users || [];
        const today = new Date().toDateString();
        const todayN = allUsers.filter(function(u){ return u.date && new Date(u.date).toDateString() === today; }).length;
        document.getElementById('total-count').textContent = data.count != null ? data.count : allUsers.length;
        document.getElementById('today-badge').textContent = '+' + todayN + ' bugun';
        renderUsers(allUsers);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('admin-view').style.display = 'block';
    }

    function renderUsers(list) {
        const c = document.getElementById('users-list');
        c.innerHTML = '';
        if (!list.length) { c.innerHTML = '<div class="empty">😕 Hech narsa topilmadi</div>'; return; }
        list.forEach(function(u, i) {
            const div = document.createElement('div');
            div.className = 'u-card';
            div.innerHTML =
                '<div class="u-idx">' + (i+1) + '</div>' +
                '<div class="u-avatar" style="background:' + aColor(u.id) + ';color:#fff">' + initials(u.name) + '</div>' +
                '<div class="u-info">' +
                  '<div class="u-name">' + (u.name || "Noma'lum") + '</div>' +
                  '<div class="u-meta">' +
                    '<span>🆔 ' + u.id + '</span>' +
                    '<span>🕐 ' + relDate(u.date) + '</span>' +
                    (u.usage ? '<span class="usage-pill">🛠 ' + u.usage + '</span>' : '') +
                  '</div>' +
                '</div>';
            c.appendChild(div);
        });
    }

    function filterUsers() {
        const q = document.getElementById('search-input').value.toLowerCase().trim();
        if (!q) { renderUsers(allUsers); return; }
        renderUsers(allUsers.filter(function(u){ return (u.name||'').toLowerCase().includes(q) || String(u.id).includes(q); }));
    }

    document.addEventListener('DOMContentLoaded', async function() {
        const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;

        try {
            const authHeaders = { 'X-Telegram-Init-Data': tg.initData };
            const adminRes = await fetch('/api/stats', { headers: authHeaders });
            if (adminRes.ok) { renderAdminView(await adminRes.json()); return; }
        } catch(e) {}

        try {
            const profileRes = await fetch('/api/user-profile', { headers: authHeaders });
            if (profileRes.ok) { renderUserView(await profileRes.json(), tgUser); return; }
        } catch(e) {}

        const name = tgUser ? tgUser.first_name : 'Foydalanuvchi';
        document.getElementById('u-avatar').textContent = initials(name);
        document.getElementById('u-name').textContent = name;
        document.getElementById('u-joined').textContent = "Botdan foydalanish uchun /start bosing";
        document.getElementById('loading').style.display = 'none';
        document.getElementById('user-view').style.display = 'block';
    });
</script>
</body>
</html>
